[package]
name = "bf-cli"
description = "Command-line Brainfuck compiler and runner for the bf-lab toolchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["brainfuck", "compiler", "cli", "codegen"]
categories = ["command-line-utilities", "compilers"]

[[bin]]
name = "bf"
path = "src/main.rs"

[dependencies]
bf-codegen = { version = "0.1.0", path = "../bf-codegen" }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.23"
